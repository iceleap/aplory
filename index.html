    <!--
      Structured data replaces the old visible "hero-meta" column. Search engines
      read this; visitors don't see it, and unlike hidden on-page text it is the
      sanctioned way to state these facts.
    -->
    <script type="application/ld+json">

        "email": "office.aplory@gmail.com",
        "telephone": "+381698440885",
        "url": "https://aplory.dev/",
        "availableLanguage": "sr",
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": [
            "Monday",
            "Tuesday",
            "Wednesday",
            "Thursday",
            "Friday",
            "Saturday",
            "Sunday"
          ],
          "opens": "00:00",
          "closes": "23:59"
        },
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Usluge",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Poruka posle propuštenog poziva"
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",

              }
            },
            {

              "itemOffered": {

                "name": "Podsetnici za termine"

            },

              "itemOffered": { "@type": "Service", "name": "Google recenzije" }

              "itemOffered": { "@type": "Service", "name": "Chat na sajtu" }

    <script id="vtag-ai-js" async src="https://r2.leadsy.ai/tag.js" data-pid="9EwRUwjpc16QLzvi" data-version="062024"></script>
  </head>
  <body>
    <!--
      Netlify registers a form by parsing the HTML it deploys. The real form is
      rendered by React and so is invisible to that parser; this static twin is
      what the build sees, and it exists only to declare the form's name and its
      fields. Nobody ever submits it. Keep the field names identical to the ones
      in src/components/ContactForm.jsx — a name that appears only there is
      silently dropped from the stored submission.
    -->
    <form
      name="kontakt"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="kontakt" />
      <input type="text" name="bot-field" aria-label="Bot field" />
      <input type="text" name="ime" aria-label="Ime" />
      <input type="email" name="email" aria-label="Email" />
      <input type="tel" name="telefon" aria-label="Telefon" />
      <select name="delatnost" aria-label="Delatnost"></select>
      <input type="text" name="delatnost-drugo" aria-label="Delatnost — drugo" />
      <input type="checkbox" name="usluge" aria-label="Usluge" />
      <input type="text" name="usluge-drugo" aria-label="Usluge — drugo" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script src="https://widgets.leadconnectorhq.com/loader.js" data-resources-url="https://widgets.leadconnectorhq.com/chat-widget/loader.js" data-widget-id="6a896cfe07754ad08a5225ae"></script>
  </body>
