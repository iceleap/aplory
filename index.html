              "@type": "Answer",
              "text": "APLORY je servis koji malim firmama u Srbiji automatski odgovara na propuštene pozive i poruke. Odgovor na upit koji klijent sam pošalje — propušten poziv, poruka na WhatsAppu, Instagramu ili sa sajta — pravno je najčistiji mogući slučaj: to je transakcioni odgovor na nešto što je klijent sam inicirao, ne neželjena marketinška poruka poslata bez povoda. APLORY ne šalje ništa dok upit prvo ne stigne od klijenta, a sadržaj odgovora unapred definiše firma koja ga koristi, nije generisan proizvoljno. Situacija je drugačija samo kod kampanja prema staroj bazi kontakata koji nisu upravo pisali — tu se, po Zakonu o oglašavanju (čl. 63) i Zakonu o zaštiti podataka o ličnosti (čl. 17), traži izričit prethodni pristanak primaoca za marketinšku komunikaciju. APLORY danas ne šalje takve kampanje. Ako se opcija slanja poruka staroj bazi ikad doda, pristanak bi se tražio odvojeno i eksplicitno pre slanja, ne pretpostavljao unapred."

  <body>
    <!--
      Netlify registers a form by parsing the HTML it deploys. The real form is
      rendered by React and so is invisible to that parser; this static twin is
      what the build sees, and it exists only to declare the form's name and its
      fields. Nobody ever submits it. Keep the field names identical to the ones
      in src/components/ContactForm.jsx — a name that appears only there is
      silently dropped from the stored submission.
    -->
    <form
      name="kontakt"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="kontakt" />
      <input type="text" name="bot-field" aria-label="Bot field" />
      <input type="text" name="ime" aria-label="Ime" />
      <input type="email" name="email" aria-label="Email" />
      <input type="tel" name="telefon" aria-label="Telefon" />
      <select name="delatnost" aria-label="Delatnost"></select>
      <input type="text" name="delatnost-drugo" aria-label="Delatnost — drugo" />
      <input type="checkbox" name="usluge" aria-label="Usluge" />
      <input type="text" name="usluge-drugo" aria-label="Usluge — drugo" />
    </form>

    <script>
      (function () {
        // Largest third-party resource on the page (see GEO/SEO audits): the
        // LeadConnector chat widget's ~188KB + main-thread burst is deferred
        // past first paint either way, but the original trigger set
        // (scroll/mousemove/touchstart/keydown, each firing the very first
        // time it happens) meant that burst usually landed within the first
        // second or two of a visit — competing with the exact moment the
        // visitor starts reading or scrolling, which is a plausible source of
        // a slow field INP even though it never shows up in a lab trace.
        //
        // Two lazier signals instead: a deliberate tap/click (real intent,
        // not incidental movement), or having actually scrolled past the
        // hero into the page body. Mousemove and keydown are dropped as
        // immediate triggers — almost any visit fires one of those instantly,
        // which defeated the point of deferring at all. A long idle fallback
        // still covers a visitor who neither scrolls nor taps anything
        // (e.g. reading via keyboard Tab without triggering the above).
        var loaded = false;
        var pointerEvents = ["touchstart", "click"];

        function loadChatWidget() {
          if (loaded) return;
          loaded = true;
          pointerEvents.forEach(function (e) {
            window.removeEventListener(e, loadChatWidget);
          });
          window.removeEventListener("scroll", onScroll);
          clearTimeout(fallback);
          var s = document.createElement("script");
          s.src = "https://widgets.leadconnectorhq.com/loader.js";
          s.setAttribute(
            "data-resources-url",
            "https://widgets.leadconnectorhq.com/chat-widget/loader.js",
          );
          s.setAttribute("data-widget-id", "6a896cfe07754ad08a5225ae");
          document.body.appendChild(s);
        }

        // Past the hero, not the first pixel of scroll — a visitor still
        // reading the hero hasn't shown intent to keep going yet.
        function onScroll() {
          if (window.scrollY > window.innerHeight * 0.6) loadChatWidget();
        }

        pointerEvents.forEach(function (e) {
          window.addEventListener(e, loadChatWidget, { passive: true, once: true });
        });
        window.addEventListener("scroll", onScroll, { passive: true });

        var idle = window.requestIdleCallback || function (cb, opts) {
          return setTimeout(cb, (opts && opts.timeout) || 0);
        };
        var fallback = setTimeout(function () {
          idle(loadChatWidget, { timeout: 2000 });
        }, 18000);
      })();
    </script>
