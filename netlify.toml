# Netlify build configuration. Keeping it in the repo means a fresh
# "connect repository" deploy is configured correctly without anyone
# re-entering settings in the dashboard.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Vite fingerprints everything under /assets, so those files can be cached
# permanently — a change produces a new filename.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Root-level assets keep stable names, so they get a shorter cache with
# revalidation rather than an immutable one.
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# HTML must never be cached hard, or a deploy won't reach people who have
# already visited.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# No rules needed for the 404: Netlify serves a root 404.html for unknown
# paths automatically, with the correct status code.

# Netlify's default "pretty URL" rewriting serves e.g. /stomatolozi as a 200
# with the same content as /stomatolozi.html, which contradicts every page's
# <link rel="canonical"> (which points to the .html form) and leaves two
# live, indexable URLs per page. Force a 301 from the extensionless form to
# the canonical .html form so there's exactly one crawlable URL per page.
[[redirects]]
  from = "/sta-radimo"
  to = "/sta-radimo.html"
  status = 301
  force = true
[[redirects]]
  from = "/stomatolozi"
  to = "/stomatolozi.html"
  status = 301
  force = true
